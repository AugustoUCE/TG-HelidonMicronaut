## Configuración de la aplicación
#micronaut.application.name=app-customers
#micronaut.server.port=8081
#micronaut.server.cors.enabled=true
#
## Datasource
#datasources.default.url=jdbc:postgresql://localhost:5432/postgres
#datasources.default.driverClassName=org.postgresql.Driver
#datasources.default.username=postgres
#datasources.default.password=postgres
#datasources.default.dialect=POSTGRES
#datasources.default.schema-generate=CREATE_DROP
#
## JPA / Hibernate
#jpa.default.entity-scan.packages=uce.edu.ec.db
#jpa.default.properties.hibernate.hbm2ddl.auto=update
#jpa.default.properties.hibernate.show_sql=true
#jpa.default.properties.hibernate.format_sql=true
#
## Endpoints
#endpoints.health.enabled=true
#endpoints.health.sensitive=false
#endpoints.info.enabled=true
#endpoints.info.sensitive=false
#
## Logging
#logger.levels.uce.edu.ec=DEBUG
#logger.levels.io.micronaut.data=DEBUG
#logger.levels.org.hibernate.SQL=DEBUG
