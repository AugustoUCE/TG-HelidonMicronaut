# ====================================
# SERVIDOR
# ====================================
server.port=8080
server.host=0.0.0.0

# ====================================
# CONSUL
# ====================================
consul.host=127.0.0.1
consul.port=8500
consul.service.address=127.0.0.1
consul.health.host=127.0.0.1
consul.health.path=/health/live
consul.register.delay.ms=3000

# ====================================
# DATASOURCE POSTGRESQL (Helidon style)
# ====================================
# IMPORTANTE: Helidon MP usa esta sintaxis específica
javax.sql.DataSource.jdbc/postgres.dataSourceClassName=org.postgresql.ds.PGSimpleDataSource
javax.sql.DataSource.jdbc/postgres.dataSource.url=jdbc:postgresql://localhost:5432/postgres
javax.sql.DataSource.jdbc/postgres.dataSource.user=postgres
javax.sql.DataSource.jdbc/postgres.dataSource.password=postgres

# ====================================
# FLYWAY (se usa en FlywayMigration.java)
# ====================================
flyway.locations=classpath:db/migration
flyway.baseline-on-migrate=true

# ====================================
# JPA / ECLIPSELINK
# ====================================
# Deshabilitar la generación automática de esquema (lo hace Flyway)
jakarta.persistence.schema-generation.database.action=none