apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-config
data:
  consul-config.hcl: |
    ui_config {
      enabled = true
    }
    client_addr = "0.0.0.0"
    bind_addr = "0.0.0.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul
  labels:
    app: consul
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: consul
        image: consul:1.15.4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8500
          name: http
          protocol: TCP
        - containerPort: 8600
          name: dns
          protocol: UDP
        env:
        - name: CONSUL_BIND_INTERFACE
          value: eth0
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
        command:
        - consul
        - agent
        - -dev
        - -ui
        - -client=0.0.0.0
        - -bind=0.0.0.0
        volumeMounts:
        - name: consul-data
          mountPath: /consul/data
      volumes:
      - name: consul-data
        persistentVolumeClaim:
          claimName: consul-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  labels:
    app: consul
spec:
  type: ClusterIP
  ports:
  - port: 8500
    targetPort: 8500
    protocol: TCP
    name: http
  - port: 8600
    targetPort: 8600
    protocol: UDP
    name: dns
  selector:
    app: consul
---
apiVersion: v1
kind: Service
metadata:
  name: consul-ui
  labels:
    app: consul
spec:
  type: ClusterIP
  ports:
  - port: 8500
    targetPort: 8500
    protocol: TCP
    name: http
  selector:
    app: consul
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: consul-ui
  labels:
    app: consul
spec:
  host: consul.apps.openshift.example.com
  to:
    kind: Service
    name: consul-ui
    weight: 100
  port:
    targetPort: http
