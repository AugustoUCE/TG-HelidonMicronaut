apiVersion: v1
kind: ConfigMap
metadata:
  name: app-web-vaadin-config
  namespace: book-store
data:
  API_BASE_URL: "http://app-books:8030/books"
  JAVA_OPTS: "-Xms256m -Xmx512m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-web-vaadin
  namespace: book-store
  labels:
    app: app-web-vaadin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-web-vaadin
  template:
    metadata:
      labels:
        app: app-web-vaadin
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
      - name: app-web-vaadin
        image: jjarteaga/app-web-vaadin-tg:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-web-vaadin-config
              key: API_BASE_URL
        - name: JAVA_OPTS
          valueFrom:
            configMapKeyRef:
              name: app-web-vaadin-config
              key: JAVA_OPTS
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: app-web-vaadin
  namespace: book-store
  labels:
    app: app-web-vaadin
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: app-web-vaadin
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: app-web-vaadin
  namespace: book-store
  labels:
    app: app-web-vaadin
spec:
  host: vaadin.apps.openshift.example.com
  to:
    kind: Service
    name: app-web-vaadin
    weight: 100
  port:
    targetPort: http
