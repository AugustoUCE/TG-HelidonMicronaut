apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  namespace: jhonartc25-dev
data:
  traefik.yaml: |
    api:
      insecure: true
      dashboard: true
    entryPoints:
      web:
        address: :8000
      api:
        address: :8090
    providers:
      file:
        filename: /etc/traefik/routes.yaml
        watch: true
    metrics:
      prometheus:
        addEntryPointsLabels: true
        addServicesLabels: true
    log:
      level: INFO
    accessLog: {}
  routes.yaml: |
    http:
      services:
        app-authors:
          loadBalancer:
            servers:
              - url: http://app-authors:8080
        app-books:
          loadBalancer:
            servers:
              - url: http://app-books:8030
        app-web-vaadin:
          loadBalancer:
            servers:
              - url: http://app-web-vaadin:8080
        consul:
          loadBalancer:
            servers:
              - url: http://consul:8500
        prometheus:
          loadBalancer:
            servers:
              - url: http://prometheus:9090
        grafana:
          loadBalancer:
            servers:
              - url: http://grafana:3000
      routers:
        traefik-dashboard:
          rule: Path(`/dashboard`) || Path(`/dashboard/`) || PathPrefix(`/api/`)
          service: api@internal
          entryPoints:
            - api
        app-authors:
          rule: Host(`app-authors.apps.openshift.example.com`)
          service: app-authors
          entryPoints:
            - web
        app-books:
          rule: Host(`app-books.apps.openshift.example.com`)
          service: app-books
          entryPoints:
            - web
        app-web-vaadin:
          rule: Host(`vaadin.apps.openshift.example.com`)
          service: app-web-vaadin
          entryPoints:
            - web
        consul:
          rule: Host(`consul.apps.openshift.example.com`)
          service: consul
          entryPoints:
            - web
        prometheus:
          rule: Host(`prometheus.apps.openshift.example.com`)
          service: prometheus
          entryPoints:
            - web
        grafana:
          rule: Host(`grafana.apps.openshift.example.com`)
          service: grafana
          entryPoints:
            - web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  labels:
    app: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      containers:
      - name: traefik
        image: traefik:3.6.6
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: web
          protocol: TCP
        - containerPort: 8090
          name: dashboard
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: traefik-config
          mountPath: /etc/traefik
          readOnly: true
        args:
        - --config.file=/etc/traefik/traefik.yaml
        - --api.insecure=true
        - --api.dashboard=true
      volumes:
      - name: traefik-config
        configMap:
          name: traefik-config
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  labels:
    app: traefik
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: web
  - port: 8090
    targetPort: 8090
    protocol: TCP
    name: dashboard
  selector:
    app: traefik
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: traefik-web
  labels:
    app: traefik
spec:
  host: traefik.apps.openshift.example.com
  to:
    kind: Service
    name: traefik
    weight: 100
  port:
    targetPort: web
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: traefik-dashboard
  labels:
    app: traefik
spec:
  host: traefik-dashboard.apps.openshift.example.com
  to:
    kind: Service
    name: traefik
    weight: 100
  port:
    targetPort: dashboard
