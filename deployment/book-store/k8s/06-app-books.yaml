apiVersion: v1
kind: ConfigMap
metadata:
  name: app-books-config
data:
  SERVER_PORT: "8030"
  CONSUL_HOST: consul
  CONSUL_PORT: "8500"
  SERVICE_HOST: app-books
  DB_HOST: postgres
  DB_USER: postgres
  AUTHORS_API_URL: "http://app-authors:8080"
  FLYWAY_LOCATIONS: classpath:db/migration
  FLYWAY_BASELINE_ON_MIGRATE: "true"
  JAVA_OPTS: "-Xms256m -Xmx512m"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-books-secret
type: Opaque
stringData:
  DB_PASSWORD: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-books
  labels:
    app: app-books
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-books
  template:
    metadata:
      labels:
        app: app-books
    spec:
      containers:
      - name: app-books
        image: augustouce/app-books-tg:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8030
          name: http
          protocol: TCP
        env:
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: app-books-config
              key: SERVER_PORT
        - name: CONSUL_HOST
          valueFrom:
            configMapKeyRef:
              name: app-books-config
              key: CONSUL_HOST
        - name: CONSUL_PORT
          valueFrom:
            configMapKeyRef:
              name: app-books-config
              key: CONSUL_PORT
        - name: SERVICE_HOST
          valueFrom:
            configMapKeyRef:
              name: app-books-config
              key: SERVICE_HOST
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-books-config
              key: DB_HOST
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: app-books-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-books-secret
              key: DB_PASSWORD
        - name: AUTHORS_API_URL
          valueFrom:
            configMapKeyRef:
              name: app-books-config
              key: AUTHORS_API_URL
        - name: FLYWAY_LOCATIONS
          valueFrom:
            configMapKeyRef:
              name: app-books-config
              key: FLYWAY_LOCATIONS
        - name: FLYWAY_BASELINE_ON_MIGRATE
          valueFrom:
            configMapKeyRef:
              name: app-books-config
              key: FLYWAY_BASELINE_ON_MIGRATE
        - name: JAVA_OPTS
          valueFrom:
            configMapKeyRef:
              name: app-books-config
              key: JAVA_OPTS
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: app-books
  labels:
    app: app-books
spec:
  type: ClusterIP
  ports:
  - port: 8030
    targetPort: 8030
    protocol: TCP
    name: http
  selector:
    app: app-books
