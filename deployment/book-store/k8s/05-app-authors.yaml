apiVersion: v1
kind: ConfigMap
metadata:
  name: app-authors-config
  namespace: book-store
data:
  SERVER_PORT: "8080"
  CONSUL_HOST: consul
  CONSUL_PORT: "8500"
  SERVICE_HOST: app-authors
  DB_HOST: postgres
  DB_USER: postgres
  FLYWAY_LOCATIONS: classpath:db/migration
  FLYWAY_BASELINE_ON_MIGRATE: "true"
  JAVA_OPTS: "-Xms256m -Xmx512m"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-authors-secret
  namespace: book-store
type: Opaque
stringData:
  DB_PASSWORD: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-authors
  namespace: book-store
  labels:
    app: app-authors
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-authors
  template:
    metadata:
      labels:
        app: app-authors
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
      - name: app-authors
        image: augustouce/app-authors-tg:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: app-authors-config
              key: SERVER_PORT
        - name: CONSUL_HOST
          valueFrom:
            configMapKeyRef:
              name: app-authors-config
              key: CONSUL_HOST
        - name: CONSUL_PORT
          valueFrom:
            configMapKeyRef:
              name: app-authors-config
              key: CONSUL_PORT
        - name: SERVICE_HOST
          valueFrom:
            configMapKeyRef:
              name: app-authors-config
              key: SERVICE_HOST
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-authors-config
              key: DB_HOST
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: app-authors-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-authors-secret
              key: DB_PASSWORD
        - name: FLYWAY_LOCATIONS
          valueFrom:
            configMapKeyRef:
              name: app-authors-config
              key: FLYWAY_LOCATIONS
        - name: FLYWAY_BASELINE_ON_MIGRATE
          valueFrom:
            configMapKeyRef:
              name: app-authors-config
              key: FLYWAY_BASELINE_ON_MIGRATE
        - name: JAVA_OPTS
          valueFrom:
            configMapKeyRef:
              name: app-authors-config
              key: JAVA_OPTS
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: app-authors
  namespace: book-store
  labels:
    app: app-authors
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: app-authors
