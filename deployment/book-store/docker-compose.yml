services:
  dbserver:
    image: postgres:17.7-alpine3.23
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: distribuida
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 54321:5432

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@dbserver:5432/distribuida?sslmode=disable"
    ports:
      - 9187:9187
    depends_on:
      - dbserver

  consul:
    image: consul:1.15.4
    command:
      - agent
      - -dev
      - -ui
      - -bind
      - 0.0.0.0
      - -client
      - 0.0.0.0
    expose:
      - 8500
    ports:
      - 8500:8500

  proxy:
    image: traefik:3.6.6
    command:
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.consulCatalog
      - --providers.consulCatalog.refreshInterval=5s
      - --providers.consulCatalog.exposedByDefault=false
      - --providers.consulCatalog.endpoint.address=consul:8500
      - --entryPoints.http.address=":80"
    ports:
      - 8888:8080   # Dashboard de Traefik
      - 8080:80     # Puerto principal del proxy
    depends_on:
      - consul

  authors:
    image: augustouce/app-authors
    environment:
      # Datasource - apunta al contenedor dbserver
      javax.sql.DataSource.jdbc/postgres.dataSource.url: jdbc:postgresql://dbserver:5432/distribuida
      javax.sql.DataSource.jdbc/postgres.dataSource.user: postgres
      javax.sql.DataSource.jdbc/postgres.dataSource.password: postgres
      javax.sql.DataSource.jdbc/postgres.dataSourceClassName: org.postgresql.ds.PGSimpleDataSource
      # Puerto del servicio
      server.port: "8080"
      # Consul - apunta al contenedor consul
      consul.host: consul
      consul.port: "8500"
    expose:
      - 8080
    ports:
      - 8081:8080
    deploy:
      replicas: 1
    depends_on:
      - dbserver
      - consul

  books:
    image: augustouce/app-books
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://dbserver:5432/distribuida
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_HTTP_PORT: 8080
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    expose:
      - 8080
    deploy:
      replicas: 1
    depends_on:
      - dbserver

  customers:
    image: augustouce/app-customers
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://dbserver:5432/distribuida
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8080
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_ENABLED: true
      SPRING_CLOUD_CONSUL_PORT: 8500
    expose:
      - 8080
    ports:
      - 8082:8080
    deploy:
      replicas: 1
    depends_on:
      - dbserver
      - authors
      - consul
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.customers.rule=PathPrefix(`/app-customers`)"
      - "traefik.http.routers.customers.entrypoints=http"
      - "traefik.http.middlewares.customers-stripprefix.stripprefix.prefixes=/app-customers"
      - "traefik.http.routers.customers.middlewares=customers-stripprefix"

  Prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config:/etc/prometheus
    ports:
      - 9090:9090
    expose:
      - 9090

  graphana:
    image: grafana/grafana-oss:latest
    ports:
      - 3000:3000
    expose:
      - 3000
    depends_on:
      - Prometheus

volumes:
  pgdata: