services:
  postgres:
    image: postgres:17.7-alpine3.23
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  consul:
    image: consul:1.15.4
    container_name: consul
    hostname: consul
    restart: unless-stopped
    command: >
      agent 
      -server 
      -ui 
      -bootstrap-expect=1 
      -client=0.0.0.0
      -bind=0.0.0.0
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - consul-data:/consul/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 3s
      retries: 3

  traefik:
    image: traefik:3.6.6
    container_name: traefik
    hostname: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.consulcatalog=true"
      - "--providers.consulcatalog.endpoint.address=consul:8500"
      - "--providers.consulcatalog.prefix=traefik"
      - "--providers.consulcatalog.exposedByDefault=false"
      - "--providers.consulcatalog.refreshInterval=10s"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "8081:8080"
    depends_on:
      consul:
        condition: service_healthy
    networks:
      - microservices-net
    labels:
      - "traefik.enable=true"


  app-authors:
    image: augustouce/app-authors-tg:latest
    container_name: app-authors
    hostname: app-authors
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080

      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      SERVICE_HOST: app-authors

      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres

      FLYWAY_LOCATIONS: classpath:db/migration
      FLYWAY_BASELINE_ON_MIGRATE: "true"

      JAVA_OPTS: -Xms256m -Xmx512m
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  app-books:
    image: augustouce/app-books-tg:latest
    container_name: app-books
    hostname: app-books
    restart: unless-stopped
    environment:
      SERVER_PORT: 8030

      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      SERVICE_HOST: app-books

      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres

      AUTHORS_API_URL: http://app-authors:8080

      FLYWAY_LOCATIONS: classpath:db/migration
      FLYWAY_BASELINE_ON_MIGRATE: "true"

      JAVA_OPTS: -Xms256m -Xmx512m
    ports:
      - "8030:8030"
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      app-authors:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8030/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


networks:
  microservices-net:
    driver: bridge
    name: microservices-network


volumes:
  postgres-data:
    name: postgres-data
  consul-data:
    name: consul-data
